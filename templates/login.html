{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Start Hero Section -->
<div class="hero">
    <div class="container">
        <div class="row justify-content-between">
            <div class="col-lg-5">
                <div class="intro-excerpt">
                    <h1>Login</h1>
                    <p class="mb-4">Welcome back! Please log in to your account.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End Hero Section -->

<div class="untree_co-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 mb-5 mb-md-0">
                <h2 class="h3 mb-3 text-black">Sign In</h2>
                <div class="p-3 p-lg-5 border bg-white">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group row mb-3">
                            <div class="col-md-12">
                                <label for="username" class="text-black">Username <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>

                        <div class="form-group row mb-4">
                            <div class="col-md-12">
                                <label for="password" class="text-black">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>

                        <div class="form-group d-flex justify-content-between align-items-center mb-3">
                            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-black btn-lg py-3 btn-block">Log In</button>
                        </div>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
