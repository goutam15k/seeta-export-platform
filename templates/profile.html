{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Start Hero Section -->
<div class="hero">
    <div class="container">
        <div class="row justify-content-between">
            <div class="col-lg-5">
                <div class="intro-excerpt">
                    <h1>My Profile</h1>
                    <p class="mb-4">Update your personal information and shipping details.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End Hero Section -->

<div class="untree_co-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 mb-5 mb-md-0">
                <h2 class="h3 mb-3 text-black">Account Details</h2>
                <div class="p-3 p-lg-5 border bg-white">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="form-group row mb-3">
                            <div class="col-md-6">
                                <label for="first_name" class="text-black">First Name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}">
                            </div>
                            <div class="col-md-6">
                                <label for="last_name" class="text-black">Last Name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}">
                            </div>
                        </div>

                        <div class="form-group row mb-3">
                            <div class="col-md-6">
                                <label class="text-black">Username</label>
                                <!-- Username is disabled because it shouldn't be changed -->
                                <input type="text" class="form-control" value="{{ user.username }}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="text-black">Email Address</label>
                                <!-- Email disabled here to prevent breaking auth, can be enabled with extra logic later -->
                                <input type="email" class="form-control" value="{{ user.email }}" disabled>
                            </div>
                        </div>

                        <div class="form-group row mb-3">
                            <div class="col-md-6">
                                <label for="mobile_number" class="text-black">Mobile Number <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="mobile_number" name="mobile_number" value="{{ user.mobile_number }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="company_name" class="text-black">Company Name</label>
                                <input type="text" class="form-control" id="company_name" name="company_name" value="{{ user.company_name }}">
                            </div>
                        </div>

                        <hr class="my-4">
                        <h3 class="h5 mb-3 text-black">Shipping Address</h3>

                        <div class="form-group row mb-3">
                            <div class="col-md-12">
                                <label for="address" class="text-black">Street Address</label>
                                <input type="text" class="form-control" id="address" name="address" value="{{ user.address }}">
                            </div>
                        </div>

                        <div class="form-group row mb-4">
                            <div class="col-md-4">
                                <label for="country" class="text-black">Country</label>
                                <input type="text" class="form-control" id="country" name="country" value="{{ user.country }}">
                            </div>
                            <div class="col-md-4">
                                <label for="state" class="text-black">State</label>
                                <input type="text" class="form-control" id="state" name="state" value="{{ user.state }}">
                            </div>
                            <div class="col-md-4">
                                <label for="zipcode" class="text-black">Zip Code</label>
                                <input type="text" class="form-control" id="zipcode" name="zipcode" value="{{ user.zipcode }}">
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-black btn-lg py-3 btn-block">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
