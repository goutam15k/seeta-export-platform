{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Start Hero Section -->
<div class="hero">
    <div class="container">
        <div class="row justify-content-between">
            <div class="col-lg-5">
                <div class="intro-excerpt">
                    <h1>Forgot Password</h1>
                    <p class="mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End Hero Section -->

<div class="untree_co-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 mb-5 mb-md-0">
                <h2 class="h3 mb-3 text-black">Reset Password</h2>
                <div class="p-3 p-lg-5 border bg-white">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group row mb-4">
                            <div class="col-md-12">
                                <label for="email" class="text-black">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-black btn-lg py-3 btn-block">Send Reset Link</button>
                        </div>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p>Remember your password? <a href="{% url 'login' %}">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
